    <div class="login-light"></div>
    <div class="login-box">
        <form action="#">

            <h2>Login</h2>
            <div class="input-box">
                <span class="icon">
                    <ion-icon name="mail"></ion-icon>
                </span>
                <input type="email" id = "email" required>
                <label>Email</label>
                <div class="input-line"></div>
            </div>
            <div class="input-box">
                <span class="icon">
                    <ion-icon name="lock-closed"></ion-icon>
                </span>
                <input type="password" id = "password"required>
                <label>Password</label>
                <div class="input-line"></div>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit">Login</button>
            <div class="register-link">
                <p>Don't have an account? <a href="#">Register</a></p>
            </div>
        </form>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>

    <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "firebase/auth https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries
    
    const btn = document.querySelector("login_btn");
    const message = document.querySelector(".message_box");
  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAHcaPwohQBZjmfJJnJytZls55CRptN3sY",
    authDomain: "login-fbdca.firebaseapp.com",
    projectId: "login-fbdca",
    storageBucket: "login-fbdca.firebasestorage.app",
    messagingSenderId: "686951570596",
    appId: "1:686951570596:web:5435efc308def103605a31"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth();

  btn.addEventListener("click",function(event){
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    event.preventDefault();
    const auth = getAuth(app);
    createUserWithEmailAndPassword(auth, email, password)
    .then((userCredential) => {
        // Signed up 
        const user = userCredential.user;
        message.textContent = "Account successfully created!";
        message.classList.remove("error");
        message.classList.add("created");
       
    })
    .catch((error) => {
            const errorCode = error.code;
            const errorMessage = error.message;
            console.log(errorCode)
            message.classList.add("error");
            if(errorCode === "auth/email-already-in-use"){
                message.textContent = "This email is already registered!";
            }
            else if(errorCode === "auth/email-already-in-use"){
                message.textContent = "This email format is incorrect!";
            }   
            else if(errorCode === "auth/email-already-in-use"){
                message.textContent = "The password must be at least 6 characters!";
            } 

    });
    });
</script>
